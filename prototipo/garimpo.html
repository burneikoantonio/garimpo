.chart { width: 100%; height: auto; display: block; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

try { const saved = JSON.parse(localStorage.getItem('garimpo') || 'null'); if (saved) S = { ...S, ...saved, tab: saved.tab || 'ofertas' }; } catch (e) {}
const persist = () => { try { localStorage.setItem('garimpo', JSON.stringify(S)); } catch (e) {} };

/* ---------- Cálculos ---------- */
const brl = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const brl2 = v => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function importCost(p) {
  if (!p.intl) return null;
  const usd = p.intl.usd;
  const produto = usd * S.cambio;
  const iof = produto * 0.035;
  const frete = REDIR[S.redir];
  const aliquota = usd <= 50 ? 0.20 : 0.60;            // exemplo: Remessa Conforme até US$ 50, 60% acima
  const ii = (produto + iof + frete) * aliquota;
  const icms = (produto + iof + frete + ii) / (1 - 0.17) - (produto + iof + frete + ii); // ICMS 17% "por dentro"
  const total = produto + iof + frete + ii + icms;
  return { usd, produto, iof, frete, aliquota, ii, icms, total };
}

function evaluate(p) {
  const brBest = [...p.stores].sort((a, b) => a.p - b.p)[0];
  const imp = importCost(p);
  const saving = imp ? 1 - imp.total / brBest.p : 0;
  const intlWins = !!imp && S.showIntl && saving * 100 >= S.minSave;
  const price = intlWins ? imp.total : brBest.p;
  const history = makeHistory(p, brBest.p);
  const others = p.stores.filter(s => s !== brBest).map(s => s.p);
  const median = others.length ? others.sort((a, b) => a - b)[Math.floor(others.length / 2)] : null;

  const disc = 1 - price / p.typical;
  const parts = {
    desconto: clamp(disc * 100, 0, 45),
    lojas: median ? clamp(10 + ((median - price) / median) * 150, 0, 25) : (intlWins ? 22 : 10),
    parecidas: clamp(8 + ((p.similar - price) / p.similar) * 60, 0, 15),
    historico: price <= Math.min(...history.slice(0, -1)) ? 15 : 0,
  };
  const score = Math.round(Object.values(parts).reduce((a, b) => a + b, 0));
  const mySize = p.group === 'one' || p.sizes.includes(S.sizes[p.group]);
  return { brBest, imp, saving, intlWins, price, history, parts, score, disc, mySize };
}

function makeHistory(p, current) {
  const h = [];
  for (let i = 0; i < 12; i++) {
    let v = p.typical * (1 - ((i * 7) % 5) * 0.012);
    if (i >= 9) v = p.typical - (p.typical - current) * ((i - 8) / 4);
    h.push(Math.round(v));
  }
  if (p.earlierLow) h[4] = p.earlierLow;
  h.push(current);
  return h;
}

function visible(list) {
  const out = [], hidden = { size: 0, intl: 0 };
  for (const p of list) {
    const e = evaluate(p);
    if (S.onlyMySize && !e.mySize) { hidden.size++; continue; }
    out.push({ p, e });
  }
  for (const p of list) { const e = evaluate(p); if (e.imp && !e.intlWins && S.showIntl) hidden.intl++; }
  return { items: out.sort((a, b) => b.e.score - a.e.score), hidden };
}

  return `<button class="tile" data-open="${p.id}">
    <div class="ph">${garment(p.kind, p.tint)}<div class="tags">${tags.join('')}</div></div>
    <div class="body">

function hiddenNote(h) {
  const lines = [];

  if (h.intl) lines.push(`${h.intl} ${h.intl > 1 ? 'importados ficaram' : 'importado ficou'} no preço do Brasil porque importar não compensava`);

function spark(h, w = 96, hgt = 28) {
  const min = Math.min(...h), max = Math.max(...h), r = max - min || 1;
  const pts = h.map((v, i) => [(i / (h.length - 1)) * (w - 4) + 2, hgt - 3 - ((v - min) / r) * (hgt - 6)]);
  const last = pts[pts.length - 1];
  return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#a8a8a8" stroke-width="1.25"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="#42be65"/></svg>`;
}

/* ---------- Detalhe do produto ---------- */
function priceChart(h) {
  const W = 360, H = 140, L = 44, R = 8, T = 12, B = 22;
  const min = Math.min(...h), max = Math.max(...h);
  const lo = Math.floor(min * 0.95 / 50) * 50, hi = Math.ceil(max * 1.02 / 50) * 50;
  const x = i => L + (i / (h.length - 1)) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, Math.round((lo + hi) / 2 / 10) * 10, hi];
  const line = h.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${x(0)},${H - B} ${line} ${x(h.length - 1)},${H - B}`;
  const minI = h.indexOf(min);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histórico de preço, 90 dias">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#393939"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('')}
    <polygon points="${area}" fill="#0f62fe" fill-opacity=".18"/>
    <polyline points="${line}" fill="none" stroke="#78a9ff" stroke-width="2"/>
    <circle cx="${x(minI)}" cy="${y(min)}" r="3.5" fill="#42be65"/>
    <circle cx="${x(h.length - 1)}" cy="${y(h[h.length - 1])}" r="4" fill="#f4f4f4"/>
    <text x="${L}" y="${H - 6}">90 dias atrás</text><text x="${W - R}" y="${H - 6}" text-anchor="end">hoje</text>
  </svg>`;
}

function closeSheet() { const s = document.getElementById('sheet'); s.hidden = true; s.innerHTML = ''; document.body.style.overflow = ''; }

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- Render ---------- */
const TABS = [['ofertas', 'Ofertas'], ['buscar', 'Buscar'], ['marcas', 'Marcas'], ['salvos', 'Salvos'], ['perfil', 'Perfil']];
const VIEWS = { ofertas: viewOfertas, buscar: viewBuscar, marcas: viewMarcas, salvos: viewSalvos, perfil: viewPerfil };
function render(keepFocus) {
  const active = keepFocus && document.activeElement && document.activeElement.id;
  const caret = active === 'q' ? document.activeElement.selectionStart : null;
  document.getElementById('app').innerHTML = VIEWS[S.tab]();
  document.getElementById('nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ICON[k]}<span>${l}</span></button>`).join('');
  if (active) { const el = document.getElementById(active); if (el) { el.focus(); if (caret !== null) el.setSelectionRange(caret, caret); } }
  persist();
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { S.tab = d.tab; closeSheet(); render(); window.scrollTo(0, 0); }
  else if (d.cat) { S.cat = d.cat; render(); }
  else if (d.qcat) { S.qCat = d.qcat; render(); }
  else if (d.open) { openDetail(d.open); }
  else if ('alerts' in d) { openAlerts(); }
  else if ('close' in d) { closeSheet(); render(); }
  else if (d.save) {
    const id = d.save;
    if (S.saved.includes(id)) { S.saved = S.saved.filter(x => x !== id); toast('Removido dos salvos'); }
    else { S.saved.push(id); S.targets[id] = Math.round(evaluate(PRODUCTS.find(p => p.id === id)).price * 0.9); toast('Salvo. Você será avisado se baixar 10%'); }
    persist(); openDetail(id);
  }
  else if ('store' in d) { toast('No app real, abre a página da loja com o melhor preço'); }
  else if (d.follow) {
    const n = d.follow;
    S.follow = S.follow.includes(n) ? S.follow.filter(x => x !== n) : [...S.follow, n];
    toast(S.follow.includes(n) ? `Seguindo ${n}. Você será avisado das sales.` : `Você deixou de seguir ${n}`); render();
  }
  else if (d.sw) {
    const path = d.sw.split('.');
    if (path.length === 2) S[path[0]][path[1]] = !S[path[0]][path[1]]; else S[path[0]] = !S[path[0]];
    render();
  }
  else if ('reset' in d) { S = structuredClone(DEFAULTS); S.tab = 'perfil'; render(); toast('Dados de exemplo restaurados'); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { S.q = t.value; render(true); return; }
  // sliders: só atualiza o número enquanto arrasta; a tela recalcula ao soltar (evento change)
  const lbl = t.type === 'range' && t.closest('.field').querySelector('.lbl');
  if (t.id === 'qMax') lbl.textContent = brl(+t.value);
  else if (t.id === 'minSave') lbl.textContent = t.value + '%';
  else if (t.id === 'notaMin') lbl.textContent = t.value;
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'qStore') S.qStore = t.value;
  else if (t.id === 'qMax') S.qMax = +t.value;
  else if (t.id === 'minSave') S.minSave = +t.value;
  else if (t.id === 'notaMin') S.notaMin = +t.value;
  else if (t.id === 'szTop') S.sizes.top = t.value;
  else if (t.id === 'szBottom') S.sizes.bottom = t.value;
  else if (t.id === 'szShoe') S.sizes.shoe = t.value;
  else if (t.id === 'redir') S.redir = t.value;
  else if (t.id === 'cambio') { const v = parseFloat(t.value); if (v > 0) S.cambio = v; }
  else if (t.dataset.target) { const v = parseFloat(t.value); if (v > 0) S.targets[t.dataset.target] = v; }
  else return;
  render();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !document.getElementById('sheet').hidden) { closeSheet(); render(); } });

render();
</script>
