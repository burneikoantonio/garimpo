<style>
/* Carbon g100: coluna de celular, cabeçalho fixo, grade de 2 colunas, barra de abas inferior */
:root {
  color-scheme: dark;
  --bg: #161616; --layer: #262626; --layer2: #393939;
  --border: #393939; --border-strong: #6f6f6f;
  --fg: #f4f4f4; --fg2: #c6c6c6; --helper: #a8a8a8;
  --accent: #0f62fe; --accent-hover: #0353e9; --accent-fg: #ffffff; --chart: #78a9ff; --chart-fill: #0f62fe; --c-produto: #378ADD; --link: #78a9ff; --good: #42be65; --warn: #f1c21b; --bad: #fa4d56;
  --sale-bg: #a2191f; --sale-fg: #ffd7d9; --new-bg: #0043ce; --new-fg: #d0e2ff;
  --ok-bg: #044317; --ok-fg: #a7f0ba; --sug-bg: #491d8b; --sug-fg: #e8daff;
  --font: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", Menlo, "Courier New", monospace;
  --photo: #e8e6e1;   /* vitrine clara: fundo das fotos no tema escuro */
  --col: 480px; --nav-h: 56px;
}
/* tema claro (Carbon White) */
:root[data-tema="claro"] {
  color-scheme: light;
  --bg: #ffffff; --layer: #f4f4f4; --layer2: #e0e0e0;
  --border: #e0e0e0; --border-strong: #8d8d8d;
  --fg: #161616; --fg2: #525252; --helper: #6f6f6f;
  --accent: #161616; --accent-hover: #393939; --accent-fg: #ffffff; --chart: #161616; --chart-fill: #161616; --c-produto: #161616;
  --link: #161616; --good: #198038; --warn: #8e6a00; --bad: #da1e28;
  --sale-bg: #ffd7d9; --sale-fg: #a2191f; --new-bg: #161616; --new-fg: #ffffff;
  --ok-bg: #a7f0ba; --ok-fg: #044317; --sug-bg: #e8daff; --sug-fg: #491d8b;
  --photo: #f4f4f4;
}
:root[data-tema="claro"] .marca-app img { filter: none; mix-blend-mode: multiply; }
/* tema escuro: cada foto vira um quadro claro com cantos arredondados */
:root:not([data-tema="claro"]) .tile .ph { margin: 6px 6px 0; width: auto; border-radius: 6px; }
:root:not([data-tema="claro"]) .vitrine button, :root:not([data-tema="claro"]) .thumb, :root:not([data-tema="claro"]) .rec-pics button { border-radius: 6px; }
/* o branco das fotos se mistura ao fundo do quadro */
.ph img, .gallery img, .thumb img, .vitrine img, .rec-pics img { mix-blend-mode: multiply; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: 14px; line-height: 1.43; letter-spacing: .16px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { max-width: var(--col); margin: 0 auto; min-height: 100vh; border-inline: 1px solid var(--border); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); }
.hdr .wrap { display: flex; align-items: center; gap: 12px; min-height: 48px; padding-block: 8px; }
.hdr h1 { font-size: 20px; font-weight: 400; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr h1 b { font-weight: 600; }
.marca-app { display: inline-flex; align-items: center; gap: 8px; }
.marca-app img { width: 28px; height: 28px; filter: invert(1); mix-blend-mode: screen; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; background: none; border: 0; position: relative; flex: none; }
.iconbtn:hover { background: var(--layer); }
.iconbtn svg { width: 20px; height: 20px; fill: none; stroke: var(--fg); stroke-width: 1.5; }
.dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

.intro { padding-block: 16px 12px; display: grid; gap: 2px; }
.intro p { margin: 0; color: var(--helper); font-size: 12px; letter-spacing: .32px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 16px; border: 1px solid var(--border-strong); background: transparent; border-radius: 16px; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.ff { background: var(--layer); padding-block: 12px 0; margin-bottom: 12px; border-block: 1px solid var(--border); }
.ff-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; }
.ff-t { font-size: 13px; font-weight: 600; letter-spacing: .32px; text-transform: uppercase; }
.ff-h .t2 { font-size: 11px; color: var(--helper); }
.ordem { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-bottom: 12px; }
.busca { display: grid; gap: 4px; padding-top: 8px; }
.busca .search { margin-block: 4px 0; }
.busca-acoes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.busca-acoes .ordem { margin-left: auto; padding-bottom: 0; }
.filtros { display: grid; gap: 4px; background: var(--layer); padding: 12px; margin-top: 4px; }
.filtros .field select { background: var(--bg); }
.comparador { margin-block: 8px 4px; }
.comparador .rowbtn { padding-inline: 0; }
.ordem label { font-size: 12px; color: var(--helper); }
.ordem select { height: 32px; background: var(--layer); border: 0; border-bottom: 1px solid var(--border-strong); padding: 0 8px; font-size: 14px; max-width: 70%; }
.ff-chip { display: inline-flex; align-items: center; text-decoration: none; color: var(--fg); background: var(--bg); }
.acoes3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; margin-top: 16px; }
.conv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.conv .panel { gap: 2px; padding: 12px; }
.barra { display: flex; height: 14px; overflow: hidden; border-radius: 4px; }
.barra i { display: block; height: 100%; }
.nota { display: grid; margin-top: 10px; font-size: 13px; }
.nota > div { display: grid; grid-template-columns: 1fr auto 44px; gap: 8px; padding-block: 7px; border-bottom: 1px solid var(--border); align-items: center; }
.nota > div > span:first-child { display: flex; align-items: center; gap: 8px; }
.nota i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.nota .pct { color: var(--helper); text-align: right; font-size: 12px; }
.nota .tot { font-weight: 600; border-bottom: 1px solid var(--border-strong); }
.nota .imp { color: var(--fg); background: var(--layer); padding-inline: 8px; border-bottom: 0; }
.acoes3 .btn { height: 52px; padding: 0 10px; justify-content: center; font-size: 13px; text-align: center; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-block: 1px solid var(--border); }
.tile { background: var(--bg); border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.tile:hover { background: var(--layer); }
.tilewrap { position: relative; display: flex; min-width: 0; background: var(--bg); }
.tilewrap > .tile { flex: 1; }
.heart { position: absolute; top: 6px; right: 6px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(22, 22, 22, .55); color: #fff; font-size: 19px; line-height: 1; display: grid; place-items: center; }
.heart.on { background: var(--bad); }
.ph { aspect-ratio: 4 / 5; width: 100%; max-width: 100%; position: relative; background: var(--photo); overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph .tags { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.tile .body { padding: 10px 12px 16px; display: grid; gap: 2px; min-width: 0; }
.brand { font-size: 11px; letter-spacing: .32px; color: var(--helper); text-transform: uppercase; }
.pname { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em; }
.prices { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.was { font-size: 11px; color: var(--helper); text-decoration: line-through; }
.now { font-size: 15px; font-weight: 500; }
.off { font-size: 11px; color: var(--good); }
.scoreline { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.meter { flex: 1; height: 4px; background: var(--layer2); position: relative; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--fg2); }
.meter.hi i { background: var(--good); }
.score { font-size: 11px; }

.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 500; letter-spacing: .32px; white-space: nowrap; }
.t-sale { background: var(--sale-bg); color: var(--sale-fg); }
.t-new { background: var(--new-bg); color: var(--new-fg); }
.t-ok { background: var(--ok-bg); color: var(--ok-fg); }
.t-sug { background: var(--sug-bg); color: var(--sug-fg); }
.t-gray { background: var(--layer2); color: var(--fg2); }
.t-intl { background: var(--sug-bg); color: var(--sug-fg); }
.justo { margin-bottom: 16px; }
.justo-scale { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; height: 6px; }
.justo-scale span:nth-child(1) { background: var(--good); }
.justo-scale span:nth-child(2) { background: var(--layer2); }
.justo-scale span:nth-child(3) { background: var(--bad); }
.justo-scale i { position: absolute; top: -5px; width: 4px; height: 16px; background: var(--fg); transform: translateX(-50%); }
.justo-legend { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 11px; color: var(--helper); }
.justo-legend span:nth-child(2) { text-align: center; }
.justo-legend span:nth-child(3) { text-align: right; }
.breakdown { display: grid; gap: 6px; font-size: 13px; }
.breakdown div { display: flex; justify-content: space-between; gap: 12px; }
.breakdown .mono { white-space: nowrap; }
.breakdown .tot { border-top: 1px solid var(--border-strong); padding-top: 8px; font-weight: 600; }

.more { display: flex; justify-content: center; padding-block: 16px; }
.note { padding-block: 16px; color: var(--helper); font-size: 12px; display: grid; gap: 4px; }

.section-h { font-size: 14px; font-weight: 600; margin: 0; padding-block: 24px 8px; }
.section-sub { color: var(--helper); font-size: 12px; margin: -4px 0 8px; }
.list { border-top: 1px solid var(--border); }
.row { display: flex; gap: 12px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--border); min-width: 0; }
.row .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row .t1 { font-size: 14px; }
.row .t2 { font-size: 12px; color: var(--helper); }
.thumb { width: 64px; height: 80px; flex: none; background: var(--photo); border: 0; padding: 0; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.avatar { width: 40px; height: 40px; flex: none; background: var(--layer2); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; }
.rowbtn { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--border); text-align: left; }
.rowbtn:hover { background: var(--layer); }

.btn { height: 40px; padding: 0 16px; border: 0; background: var(--accent); color: var(--accent-fg); font-size: 14px; display: inline-flex; align-items: center; justify-content: space-between; gap: 24px; text-decoration: none; }
.btn:hover { background: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--link); padding: 0 8px; }
.btn.ghost:hover { background: var(--layer); }
.btn.tertiary { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.btn.tertiary:hover { background: var(--fg); color: var(--bg); }
.btn.sm { height: 32px; font-size: 13px; }

.search { display: flex; align-items: center; gap: 8px; height: 48px; background: var(--layer); border-bottom: 1px solid var(--border-strong); padding: 0 12px; margin-block: 16px 12px; }
.search svg { width: 18px; height: 18px; stroke: var(--helper); fill: none; stroke-width: 1.5; flex: none; }
.search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; font-size: 16px; }
.search input::placeholder { color: #6f6f6f; }
.field { display: grid; gap: 8px; padding-block: 8px; min-width: 0; }
.field label, .lbl { font-size: 12px; color: var(--fg2); letter-spacing: .32px; }
.field select, .field input[type="number"] { height: 40px; background: var(--layer); border: 0; border-bottom: 1px solid var(--border-strong); padding: 0 12px; font-size: 16px; min-width: 0; width: 100%; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.range-val { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; border-bottom: 1px solid var(--border); }
.toggle .grow { display: grid; gap: 2px; min-width: 0; }
.toggle small { color: var(--helper); font-size: 12px; }
.switch { width: 48px; height: 24px; border-radius: 12px; background: #8d8d8d; border: 0; position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: #24a148; }
.switch[aria-checked="true"]::after { transform: translateX(24px); }

.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 25; max-width: var(--col); margin: 0 auto; background: var(--layer); border-top: 1px solid var(--border); border-inline: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav .navdot { position: absolute; top: 8px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.rec { padding-block: 16px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
.rec-top { display: flex; align-items: flex-start; gap: 12px; }
.rec-top .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
.rec-name { font-size: 16px; font-weight: 600; }
.rec-why { font-size: 13px; color: var(--fg2); }
.rec-pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.rec-pics button { border: 0; padding: 0; background: var(--photo); aspect-ratio: 4 / 5; overflow: hidden; }
.rec-pics img { width: 100%; height: 100%; object-fit: cover; }
.rec-links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
.vitrine { display: flex; gap: 4px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.vitrine::-webkit-scrollbar { display: none; }
.vitrine button { flex: none; width: 38%; border: 0; padding: 0; background: var(--photo); aspect-ratio: 4 / 5; position: relative; overflow: hidden; scroll-snap-align: start; }
.vitrine img { width: 100%; height: 100%; object-fit: cover; }
.vitrine .mono { position: absolute; left: 6px; bottom: 6px; background: rgba(22,22,22,.75); color: #fff; font-size: 11px; padding: 2px 6px; }
.rec-links a, .rec-links button { color: var(--link); background: none; border: 0; padding: 0; font-size: 13px; text-decoration: none; }
.nav button { height: var(--nav-h); background: none; border: 0; display: grid; place-items: center; gap: 2px; padding-top: 6px; font-size: 11px; color: var(--helper); letter-spacing: .32px; position: relative; }
.nav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.nav button[aria-current="page"] { color: var(--fg); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 20%; right: 20%; height: 2px; background: var(--accent); }

.sheet { position: fixed; inset: 0; z-index: 40; max-width: var(--col); margin: 0 auto; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; border-inline: 1px solid var(--border); padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); }
.sheet .hdr { top: 0; }
.gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: var(--photo); scrollbar-width: none; }
.gallery::-webkit-scrollbar { display: none; }
.gallery img { flex: none; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; scroll-snap-align: start; }
.gallery-count { color: var(--helper); font-size: 11px; padding-top: 6px; }
.detail-head { padding-block: 12px 16px; display: grid; gap: 4px; }
.detail-head h2 { font-size: 22px; font-weight: 400; margin: 0; line-height: 1.27; text-wrap: balance; }
.bigprice { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.bigprice .now { font-size: 28px; font-weight: 400; }
.sizes { display: flex; flex-wrap: wrap; gap: 6px; }
.size { min-width: 40px; height: 32px; padding: 0 8px; display: inline-grid; place-items: center; border: 1px solid var(--border-strong); font-family: var(--mono); font-size: 12px; }
.size.off { color: #6f6f6f; border-color: var(--border); text-decoration: line-through; }
.size.mine { border-color: var(--good); color: var(--good); }
.panel { background: var(--layer); padding: 16px; display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.bar-row .meter { grid-column: 1 / -1; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--helper); font-family: var(--mono); font-size: 10px; }
.notice { border-left: 3px solid var(--warn); background: var(--layer); padding: 12px 16px; font-size: 13px; display: grid; gap: 4px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 16px; }
.actions .btn { height: 56px; align-items: flex-start; padding-top: 12px; }

.toast { position: fixed; z-index: 60; left: 16px; right: 16px; margin: 0 auto; max-width: calc(var(--col) - 32px); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px); background: var(--fg); color: var(--bg); padding: 12px 16px; font-size: 13px; border-left: 3px solid var(--good); }
.loading { padding: 48px 16px; color: var(--helper); text-align: center; }

@media (max-width: 500px) { .app, .nav, .sheet { border-inline: 0; } }
/* selo "Powered by Netlify" (plano grátis) ficava por cima das abas Salvos e Perfil */
#nl-badge-frame { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"><p class="loading">Carregando catálogo…</p></div>
<nav class="nav" id="nav" aria-label="Navegação principal"></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="core.js?v=1794774785"></script>
<script>
/* ---------- Ícones ---------- */
const ICON = {

  novas: '<svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',

async function load() {
  const get = async u => { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(u); return r.json(); };
  const idx = await get('data/marcas.json');
  const hist = await get('data/historico.json').catch(() => ({}));
  const cambio = await get('data/cambio.json').catch(() => null);
  const fontes = idx.marcas.flatMap(m => (m.arquivos || []).map(a => ({ m, a })));
  const cats = await Promise.all(fontes.map(({ m, a }) => get(a).then(c => ({ m, c })).catch(() => null)));
  const segue = idx.marcas.filter(m => m.relacao === 'segue').map(m => m.nome);
  if (!S.follow) S.follow = [...segue];
  // marca que passou a ser "sua" (ex.: New Balance) entra sozinha na lista de seguidas
  const vistas = store.get('segueVistas', SEGUE_ANTIGAS);
  for (const n of segue) if (!vistas.includes(n) && !S.follow.includes(n)) S.follow.push(n);
  store.set('segueVistas', segue);
  DATA = buildData(idx, cats, hist, cambio);
  FF = await get("farfetch.json").catch(() => null);
  SX = await get("stockx.json").catch(() => null);
}

// o app aprende com o "Não curti": cada peça escondida da mesma marca e tipo empurra as parecidas para baixo no feed
function naoCurtiContagem() {
  const c = {};
  for (const o of Object.values(S.ocultas)) c[o.marca + '|' + o.kind] = (c[o.marca + '|' + o.kind] || 0) + 1;
  return c;
}
const naoCurtiPeso = p => Math.min(40, 12 * (naoCurtiContagem()[p.marca + '|' + p.kind] || 0));
// o "Curti" faz o contrário: peças da mesma marca e tipo sobem; o mesmo tipo em outras marcas sobe um pouco
function estilo() {
  const mk = {}, marca = {}, kind = {};
  for (const c of Object.values(S.curtidas)) { mk[c.marca + '|' + c.kind] = (mk[c.marca + '|' + c.kind] || 0) + 1; marca[c.marca] = (marca[c.marca] || 0) + 1; kind[c.kind] = (kind[c.kind] || 0) + 1; }
  return { mk, marca, kind };
}
const curtiPeso = p => { const e = estilo(); return Math.min(30, 10 * (e.mk[p.marca + '|' + p.kind] || 0)) + Math.min(12, 3 * (e.marca[p.marca] || 0)) + Math.min(9, 3 * (e.kind[p.kind] || 0)); };

function feedList(filter) {
  const out = []; let hiddenSize = 0;
  for (const p of DATA.produtos) {
    if (S.ocultas[p.key] || (filter && !filter(p))) continue;
    const e = evaluate(p);
    if (!e.ok) { if (e.avail.length) hiddenSize++; continue; }
    out.push({ p, e });
  }
  return { items: out.sort((a, b) => b.e.score - a.e.score || b.e.off - a.e.off), hiddenSize };
}

// ordenação escolhida pelo usuário (vale para Ofertas e Buscar)
const ORDENS = { nota: 'Melhor nota', menor: 'Menor preço', maior: 'Maior preço', desconto: 'Maior desconto', novos: 'Mais novos', justo: 'Mais abaixo do preço justo' };
function ordenar(lista) {

    menor: (a, b) => a.e.price - b.e.price,
    maior: (a, b) => b.e.price - a.e.price,
    desconto: (a, b) => b.e.off - a.e.off || b.e.score - a.e.score,

    justo: (a, b) => (a.e.justo?.dif ?? 9) - (b.e.justo?.dif ?? 9),

  return [...lista].sort(f);
}
const seletorOrdem = id => `<div class="ordem"><label for="${id}">Ordenar por</label><select id="${id}" data-ordem>${Object.entries(ORDENS).map(([k, v]) => `<option value="${k}" ${S.sort === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`;

// modelo: o nome da peça sem a marca e sem palavras genéricas ("Tênis New Balance 9060 Unissex" → "9060")
const GENERICAS = new Set(['tenis', 'tênis', 'unissex', 'unisex', 'masculino', 'masculina', 'feminino', 'feminina', 'de', 'da', 'do', 'com', 'e', 'em', 'the', 'men', 'mens', 'adulto']);
function modeloChave(p) {
  const marca = new Set(p.marca.toLowerCase().split(/\s+/));
  return p.titulo.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-z0-9]+/)
    .filter(w => w && !GENERICAS.has(w) && !marca.has(w) && !(p.marca === 'Adidas Originals' && w === 'adidas')).sort().join(' ');
}
// comparador: para o que foi buscado, qual loja tem mais barato e quais dos seus tamanhos cada uma tem
function porLoja(lista) {
  const lojas = {};
  for (const { p, e } of lista) for (const l of e.lojas) {
    const o = p.ofertas.find(x => x.loja === l.loja);
    const tam = (o?.variantes || []).filter(v => v.a && v.p >= 10 && fits(v.t, p.group) && p.group !== 'one').map(v => sizeLabel(v.t));
    const L = (lojas[l.loja] ||= { loja: l.loja, min: Infinity, n: 0, tam: new Set(), melhor: null });
    L.n++; tam.forEach(t => L.tam.add(t));
    if (l.price < L.min) { L.min = l.price; L.melhor = p; }
  }
  return Object.values(lojas).sort((a, b) => a.min - b.min);
}
// ordem natural dos tamanhos: números primeiro, depois PP, P, M, G, GG, XGG
const ordemTam = t => (isNaN(+t) ? 100 + ['PP', 'P', 'M', 'G', 'GG', 'XGG'].indexOf(t) : +t);
const tamTxt = s => [...s].sort((m, n) => ordemTam(m) - ordemTam(n)).join(', ');
const seloLoja = (L, i) => i !== 0 ? '' : L[1] && L[1].min === L[0].min ? '<span class="tag t-gray">Mesmo preço</span>' : '<span class="tag t-ok">Mais barato</span>';
const semAcento = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function comparador(lista) {
  const L = porLoja(lista);
  if (L.length < 2) return '';
  const [a, b] = L, eco = Math.round((1 - a.min / L[L.length - 1].min) * 100);
  return `<div class="wrap"><div class="panel comparador">
    <strong>Onde está mais barato: "${esc(S.q.trim() || 'sua busca')}"</strong>
    <span class="t2" style="color:var(--fg2);font-size:13px"><b>${esc(a.loja.replace(/^Site /, 'Site da '))}</b> tem a partir de <b class="mono">${brl(a.min)}</b>${eco > 0 ? `, ${eco}% menos que a loja mais cara` : ''}. Preços nos seus tamanhos; cores podem variar.</span>
    <div class="list">${L.map((x, i) => `<button class="row rowbtn" data-loja="${esc(x.loja)}">
      <div class="grow"><span class="t1">${esc(x.loja)} ${seloLoja(L, i)}</span>
        <span class="t2">${x.n} ${x.n > 1 ? 'opções' : 'opção'}${x.tam.size ? ` · seus tamanhos: ${tamTxt(x.tam)}` : ''}</span></div>
      <span class="mono" style="font-size:15px">${brl(x.min)}</span></button>`).join('')}</div>
    <span class="t2" style="color:var(--helper);font-size:11px">Só lojas confiáveis: sites oficiais das marcas e grandes multimarcas. Toque numa loja para ver só as peças dela.</span>
  </div></div>`;
}

/* ---------- Marcas novas: escolhidas e mostradas pelo seu estilo, não pela nota ---------- */
// fotos de vitrine: peças do tipo que você curte primeiro, depois a ordem da própria loja (as marcas põem as melhores na frente)
function fotosBonitas(m, n = 6) {
  const e = estilo(), todas = DATA.produtos.filter(p => p.marca === m.nome);
  return todas.map((p, i) => ({ p, ev: evaluate(p), i }))
    .filter(x => x.ev.ok && x.p.imagens.length && !S.ocultas[x.p.key])
    .map(x => ({ ...x, s: 3 * (e.kind[x.p.kind] || 0) + 2 * (1 - x.i / todas.length) + (x.p.imagens.length > 1 ? 0.5 : 0) + (x.p.cat === 'Acessórios' ? -1.5 : 0) + (x.ev.novo ? 0.5 : 0) + (S.curtidas[x.p.key] ? 5 : 0) }))
    .sort((a, b) => b.s - a.s).slice(0, n);
}
// afinidade da marca com o que você curtiu: mesma marca pesa muito; tipos de peça que você curte pesam pela quantidade
function afinidade(m) {
  const e = estilo(), ps = DATA.produtos.filter(p => p.marca === m.nome);
  if (!ps.length) return 0;
  const tipos = Object.entries(e.kind).reduce((s, [k, v]) => s + v * ps.filter(p => p.kind === k).length / ps.length, 0);
  return 10 * (e.marca[m.nome] || 0) + 4 * tipos;
}
function cardMarca(m) {
  const fotos = fotosBonitas(m);
  const ps = DATA.produtos.filter(p => p.marca === m.nome).map(evaluate).filter(e => e.ok);
  const sale = ps.filter(e => e.off > 0);
  const max = sale.length ? Math.round(Math.max(...sale.map(e => e.off)) * 100) : 0;
  const nova = m.liberada && m.liberada === ultimaLeva(); // selo só para a leva mais recente
  return `<div class="rec">

      <span class="t2" style="color:var(--helper);font-size:12px">${ps.length} peças nos seus tamanhos${sale.length ? ` · ${sale.length} em sale, até ${max}%` : ''}</span></div>

    ${fotos.length ? `<div class="vitrine">${fotos.map(x => `<button data-open="${esc(x.p.key)}" aria-label="${esc(x.p.titulo)}"><img loading="lazy" src="${esc(img(x.p.imagens[0], 300))}" alt=""><span class="mono">${brl(x.ev.price)}</span></button>`).join('')}</div>` : ''}

  </div>`;
}

/* ---------- Aba Farfetch: marcas e achados escolhidos à mão (o robô não consegue ler a Farfetch) ---------- */
let FF = null, SX = null;
// A Farfetch Brasil já embute o imposto de importação no preço e cobra o frete internacional à parte.
// Separamos o total pago em produto, frete e impostos (estimativa com as alíquotas de farfetch.json).
function custoFarfetch(preco) {
  const c = FF?.custos || { freteBRL: 99, ii: 0.6, icms: 0.17 };
  const total = preco + c.freteBRL;
  const base = total * (1 - c.icms) / (1 + c.ii);            // valor aduaneiro: produto + frete, sem impostos
  const frete = c.freteBRL * (1 - c.icms) / (1 + c.ii);
  const produto = base - frete, ii = base * c.ii, icms = total - base - ii;
  return { total, produto, frete, ii, icms, impostos: ii + icms, c };
}
// Comparação final: Brasil (Farfetch BR entregue) × EUA (preço da loja lá e o custo de trazer por conta própria).
// O preço americano é estimado a partir do preço sem impostos (a Farfetch não deixa abrir a loja dos EUA daqui).
const FRETE_EUA_USD = 30; // redirecionador/loja americana até o Brasil
function comparaImportado(a) {
  const k = custoFarfetch(a.por), usd = DATA.cambio?.USD || 5.5;
  const euaUsd = k.produto / usd;
  const euaCheioUsd = a.de ? custoFarfetch(a.de).produto / usd : euaUsd;
  const trazer = custoImportado({ moeda: 'USD', frete: FRETE_EUA_USD }, euaUsd);
  const trazerTotal = trazer ? trazer.total : k.total;
  const econ = (trazerTotal - k.total) / trazerTotal;          // quanto a Farfetch BR economiza vs trazer você mesmo
  const razao = k.total / (euaCheioUsd * usd);                  // total aqui ÷ preço cheio na loja americana
  const pDesc = Math.min(40, (a.off || 0) * 40 / 70);
  const pRota = Math.max(0, Math.min(30, econ * 100));
  const pCheio = Math.max(0, Math.min(30, (1.5 - razao) * 30));
  const nota = Math.round(pDesc + pRota + pCheio);
  const veredito = nota >= 75 ? 'Ótima compra' : nota >= 50 ? 'Boa compra' : nota >= 30 ? 'Compra ok' : 'Só se gostar muito';
  return { k, usd, euaUsd, euaCheioUsd, trazer, trazerTotal, econ, razao, nota, veredito, pts: [pDesc, pRota, pCheio] };
}

        <div class="panel"><span class="t2" style="color:var(--helper);font-size:12px">2 · Com frete e impostos</span><span class="mono" style="font-size:24px">${brl(Math.round(k.total))}</span><span class="t2" style="color:var(--helper);font-size:12px">o que chega na sua casa</span></div>
      </div>
      <h3 class="section-h">Para onde vai o dinheiro</h3>
      <div class="barra">${partes.map(([, v, c]) => `<i style="width:${v / k.total * 100}%;background:${c}"></i>`).join('')}</div>
      <div class="nota">
        ${partes.map(([n, v, c]) => `<div><span><i style="background:${c}"></i>${esc(n)}</span><span class="mono">${fmt2(v)}</span><span class="mono pct">${pct(v)}%</span></div>`).join('')}
        <div class="tot"><span>Total que você paga</span><span class="mono">${fmt2(k.total)}</span><span></span></div>
        <div class="imp"><span>Impostos no total</span><span class="mono">${fmt2(k.impostos)}</span><span class="mono pct">${pct(k.impostos)}%</span></div>

      ${a.de ? `<h3 class="section-h">Preço</h3>

        <div class="meter hi"><i style="width:${a.por / a.de * 100}%"></i></div></div>` : ''}
      ${(() => {

        const linhas = [
          ['🇧🇷 Aqui no Brasil', 'Farfetch Brasil, entregue com frete e impostos', k.total, true],

          ['🇺🇸 Trazer dos EUA você mesmo', `${usd2(cp.euaUsd)} + frete ${usd2(FRETE_EUA_USD)} + IOF, imposto de importação e ICMS`, cp.trazerTotal, false],
        ];
        const maxV = Math.max(...linhas.map(l => l[2]));
        return `<h3 class="section-h">Comparação final: Brasil × EUA</h3>

          ${linhas.map(([t, sub, v, br]) => `<div style="display:grid;gap:4px;margin-bottom:12px">

        </div>
        <div class="panel" style="margin-top:12px;display:grid;gap:8px">
          <div class="range-val"><span style="font-size:16px;font-weight:600">${cp.veredito}</span><span class="score mono" style="font-size:20px">Nota ${cp.nota}</span></div>

            Mas, por causa dos impostos, você paga cerca de <b>${(k.total / (cp.euaUsd * cp.usd)).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}×</b> o preço da etiqueta americana.</p>
          <div class="nota" style="margin-top:0">

      })()}
      <div class="actions" style="grid-template-columns:1fr"><a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">Ver na Farfetch ↗</a></div>

}

// StockX x Brasil: custo total para importar o tênis comparado ao menor preço dele nas lojas brasileiras
function stockxBloco() {
  if (!SX || !DATA.cambio?.USD) return '';
  const linhas = SX.modelos.map(m => {
    const custo = custoImportado({ moeda: 'USD', frete: SX.freteUsd }, m.ultimaVenda);
    const re = new RegExp(m.busca.split(' ').join('.*'), 'i');
    const br = DATA.produtos.filter(p => p.cat === 'Tênis' && re.test(p.titulo)).map(p => ({ p, e: evaluate(p) })).filter(x => x.e.ok && !x.e.intl).sort((a, b) => a.e.price - b.e.price)[0];
    const dif = br ? custo.total / br.e.price - 1 : null;
    const compensa = br && dif <= 0.05;
    return { m, custo, br, dif, compensa };

    ${linhas.map(({ m, custo, br, dif, compensa }) => `<div class="row" style="align-items:flex-start">

      <div class="grow">
        <span class="t1">${esc(m.modelo)}</span>
        <span class="t2">StockX: último vendido US$ ${m.ultimaVenda} → <b class="mono">${brl(custo.total)}</b> com tudo</span>

  </div>`;
}

  const initials = n => n.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const stats = m => {
    const ps = DATA.produtos.filter(p => p.marca === m.nome).map(p => evaluate(p)).filter(e => e.ok);
    const sale = ps.filter(e => e.off > 0);
    return { total: ps.length, sale: sale.length, max: sale.length ? Math.round(Math.max(...sale.map(e => e.off)) * 100) : 0 };
  };
  const row = m => {
    const f = S.follow.includes(m.nome);
    let sub, tag = '';
    if (m.arquivos?.length) {
      const s = stats(m);

function spark(h, w = 88, hgt = 28) {
  if (h.length < 2) return `<span class="t2" style="font-size:10px">histórico começou ${esc(fmtDate(h[0]?.[0]))}</span>`;
  const vals = h.map(([, v]) => v), min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (w - 4) + 2, hgt - 3 - ((v - min) / r) * (hgt - 6)]);
  const last = pts[pts.length - 1];
  return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#a8a8a8" stroke-width="1.25"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="#42be65"/></svg>`;
}
const fmtDate = d => d ? d.split('-').reverse().slice(0, 2).join('/') : '';

/* ---------- Alertas (gerados a partir do histórico) ---------- */
function buildAlerts() {
  const out = [];
  for (const k of Object.keys(S.saved)) {
    const p = DATA.produtos.find(x => x.key === k); if (!p) continue;
    const e = evaluate(p); if (!e.ok) continue;
    if (e.price <= S.saved[k].alvo) out.push({ tag: ['t-ok', 'Alvo'], t: `${p.titulo} está ${brl(e.price)}, abaixo do seu alvo`, key: k });
    else if (e.baixou) out.push({ tag: ['t-sale', 'Baixou'], t: `${p.titulo} baixou para ${brl(e.price)}`, key: k });
  }
  const brands = activeBrands();
  for (const p of DATA.produtos) {
    if (!brands.has(p.marca) || S.saved[p.key]) continue;
    const e = evaluate(p); if (!e.ok) continue;
    if (e.baixou && e.score >= S.notaMin) out.push({ tag: ['t-sale', 'Baixou'], t: `${p.marca}: ${p.titulo} baixou para ${brl(e.price)}`, key: p.key });
    else if (e.novo && S.follow.includes(p.marca)) out.push({ tag: ['t-new', 'Novo'], t: `${p.marca} lançou ${p.titulo}`, key: p.key });
  }
  return out.slice(0, 30);
}
function openAlerts() {
  const a = buildAlerts();
  showSheet(`<header class="hdr"><div class="wrap"><h1>Alertas</h1><button class="iconbtn" data-close aria-label="Fechar">${ICON.close}</button></div></header>
    <div class="wrap"><p class="section-sub" style="margin:16px 0 12px">Quedas de preço aparecem a partir da segunda atualização, quando há com o que comparar.</p>
    <div class="list">${a.map(x => `<button class="row rowbtn" data-open="${esc(x.key)}"><span class="tag ${x.tag[0]}">${x.tag[1]}</span><div class="grow"><span class="t1">${esc(x.t)}</span></div></button>`).join('') || '<p class="section-sub" style="padding-block:16px">Nenhum alerta no momento.</p>'}</div></div>`);
}

/* ---------- Detalhe ---------- */
function priceChart(h) {
  const vals = h.map(([, v]) => v);
  const W = 360, H = 140, L = 48, R = 8, T = 12, B = 22;
  const min = Math.min(...vals), max = Math.max(...vals);
  const lo = Math.floor(min * 0.95 / 10) * 10, hi = Math.ceil(max * 1.05 / 10) * 10;
  const x = i => L + (i / (vals.length - 1)) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const line = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histórico de preço">
    ${[lo, hi].map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--border)"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('')}
    <polygon points="${x(0)},${H - B} ${line} ${x(vals.length - 1)},${H - B}" style="fill:var(--chart-fill)" fill-opacity=".18"/>
    <polyline points="${line}" fill="none" style="stroke:var(--chart)" stroke-width="2"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="4" style="fill:var(--fg)"/>
    <text x="${L}" y="${H - 6}">${fmtDate(h[0][0])}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(h[h.length - 1][0])}</text>
  </svg>`;
}

      <div class="sizes">${sizes}</div>
      ${e.ok ? `<h3 class="section-h">Nota de Oferta</h3><div class="panel">
        <div class="range-val"><span class="t2" style="color:var(--helper);font-size:12px">${e.temHist ? 'Com histórico' : 'Sem histórico ainda'} · calculada sobre ${e.max} pontos</span><span class="mono" style="font-size:24px;color:${e.score >= S.notaMin ? 'var(--good)' : 'var(--fg)'}">${e.score}<span style="font-size:13px;color:var(--helper)">/100</span></span></div>
        ${bars.map(b => `<div class="bar-row"><span>${b[0]}</span><span class="mono" style="color:var(--helper)">${Math.round(b[1])}/${b[2]}</span><span class="meter ${b[1] / b[2] > .6 ? 'hi' : ''}"><i style="width:${(b[1] / b[2]) * 100}%"></i></span></div>`).join('')}
      </div>` : ''}
      ${lojasBlock}
      ${(() => {
        // o mesmo modelo vendido em outras lojas (outras cores entram juntas)
        const chave = modeloChave(p);
        if (!chave) return '';
        const iguais = DATA.produtos.filter(x => x.marca === p.marca && modeloChave(x) === chave).map(x => ({ p: x, e: evaluate(x) })).filter(x => x.e.ok);
        const L = porLoja(iguais);
        if (L.length < 2) return '';
        return `<h3 class="section-h">Mesmo modelo em outras lojas</h3>
          <p class="section-sub">Menor preço de cada loja nos seus tamanhos. Cores podem variar.</p>
          <div class="list">${L.map((x, i) => `<button class="row rowbtn" data-open="${esc(x.melhor.key)}">
            <div class="grow"><span class="t1">${esc(x.loja)} ${seloLoja(L, i)}</span>
              <span class="t2">${x.n} ${x.n > 1 ? 'cores/opções' : 'opção'}${x.tam.size ? ` · seus tamanhos: ${tamTxt(x.tam)}` : ''}</span></div>
            <span class="mono" style="font-size:15px">${brl(x.min)}</span></button>`).join('')}</div>`;
      })()}
      ${intlBlock}
      <h3 class="section-h">Histórico de preço</h3>
      ${histBlock}
      <div class="acoes3">
        <button class="btn ${saved ? '' : 'tertiary'}" data-save="${esc(key)}" aria-pressed="${saved}">${saved ? '🔔 Alerta ligado' : '🔔 Alerta'}</button>
        <button class="btn ${curti ? '' : 'tertiary'}" data-curti="${esc(key)}" aria-pressed="${curti}" style="${curti ? 'background:var(--bad)' : ''}">${curti ? '♥ Curtido' : '♡ Curti'}</button>
        <a class="btn" href="${esc(e.ok ? e.lojas[0].url : p.ofertas[0].url)}" target="_blank" rel="noopener">${e.ok && e.lojas.length > 1 && e.lojas[1].price > e.lojas[0].price ? 'Mais barato ↗' : 'Ver na loja ↗'}</a>
      </div>
      <p class="section-sub" style="margin-top:8px">🔔 avisa quando o preço sair do comum. ♡ ensina o Achei a trazer mais peças e marcas assim.</p>
      <button class="btn ghost" data-ocultar="${esc(key)}" style="margin-top:4px;color:var(--helper)">Não curti: esconder esta peça</button>
    </div>`);
}

function showSheet(html) { const s = document.getElementById('sheet'); s.innerHTML = html; s.hidden = false; s.scrollTop = 0; document.body.style.overflow = 'hidden'; }
function closeSheet() { const s = document.getElementById('sheet'); s.hidden = true; s.innerHTML = ''; document.body.style.overflow = ''; }
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- Render ---------- */
const TABS = [['ofertas', 'Ofertas'], ['marcas', 'Marcas'], ['farfetch', 'Importados'], ['salvos', 'Salvos'], ['perfil', 'Perfil']];
const VIEWS = { ofertas: viewOfertas, marcas: viewMarcas, farfetch: viewFarfetch, salvos: viewSalvos, perfil: viewPerfil };
// a aba Novas ganha um ponto vermelho quando entra uma leva que você ainda não abriu
const ultimaLeva = () => DATA.marcas.filter(m => m.relacao === 'sugerida' && m.liberada).map(m => m.liberada).sort().pop() || '';
const temNovidade = () => ultimaLeva() > store.get('novasVistas', '');
function persist() { store.set('tab', S.tab); store.set('sizes', S.sizes); store.set('onlyMySize', S.onlyMySize); store.set('withSuggested', S.withSuggested); store.set('notaMin', S.notaMin); store.set('saved', S.saved); store.set('follow', S.follow); store.set('showIntl', S.showIntl); store.set('minSave', S.minSave); store.set('ocultas', S.ocultas); store.set('sort', S.sort); store.set('tema', S.tema); store.set('modelos', S.modelos); store.set('curtidas', S.curtidas); store.set('canal', S.canal); agendarSync(); }

/* ---------- Sincronia com o robô: salvos, alertas de modelo e tamanhos vão por um canal privado do ntfy ---------- */
// o robô lê "<seu canal>-prefs" depois de cada atualização; só o que importa para os avisos é enviado
const prefsAtuais = () => JSON.stringify({ tamanhos: S.sizes, follow: S.follow, salvos: Object.fromEntries(Object.entries(S.saved).map(([k, v]) => [k, { titulo: v.titulo, alvo: v.alvo }])), modelos: S.modelos, curtidas: Object.fromEntries(Object.entries(S.curtidas).map(([k, v]) => [k, { marca: v.marca, kind: v.kind, titulo: v.titulo }])) });
let syncT;
function agendarSync() {
  if (!S.canal) return;
  const atual = prefsAtuais();
  if (atual === store.get('ultimoSync', '')) return;
  clearTimeout(syncT);
  syncT = setTimeout(() => sincronizar(atual), 1500);
}
async function sincronizar(atual = prefsAtuais(), avisar = false) {
  if (!S.canal) return;
  try {
    const r = await fetch('https://ntfy.sh/', { method: 'POST', body: JSON.stringify({ topic: S.canal + '-prefs', message: JSON.stringify({ ...JSON.parse(atual), em: Date.now() }) }) });
    if (!r.ok) throw new Error(r.status);
    store.set('ultimoSync', atual); store.set('ultimoSyncEm', Date.now());
    if (avisar) { toast('Enviado. O robô usa isso na próxima atualização.'); render(); }
  } catch (e) { if (avisar) toast('Não consegui enviar agora. Tente de novo com internet.'); }
}
function render(keepFocus) {
  const active = keepFocus && document.activeElement && document.activeElement.id;
  const caret = active === 'q' ? document.activeElement.selectionStart : null;
  document.getElementById('app').innerHTML = VIEWS[S.tab]();
  if (S.tab === 'marcas') store.set('novasVistas', ultimaLeva());
  document.getElementById('nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ICON[k]}<span>${l}</span>${k === 'marcas' && temNovidade() ? '<i class="navdot"></i>' : ''}</button>`).join('');
  if (active) { const el = document.getElementById(active); if (el) { el.focus(); if (caret !== null) el.setSelectionRange(caret, caret); } }
  persist();
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { S.tab = d.tab; S.limit = 40; closeSheet(); render(); window.scrollTo(0, 0); }
  else if (d.cat) { S.cat = d.cat; S.limit = 40; render(); }
  else if (d.qkind) { S.qKind = d.qkind; S.limit = 40; render(); }
  else if ('more' in d) { S.limit += 40; render(); }
  else if (d.open) { openDetail(d.open); }
  else if ('alerts' in d) { openAlerts(); }
  else if ('close' in d) { closeSheet(); render(); }
  else if (d.brand) { S.tab = 'ofertas'; S.qBrand = d.brand; S.q = ''; S.qKind = 'Tudo'; S.limit = 40; render(); window.scrollTo(0, 0); }
  else if (d.save) {
    // alerta sem alvo: o robô avisa quando o preço sair do comum (abaixo do preço justo, menor já visto ou queda forte)
    const k = d.save, p = DATA.produtos.find(x => x.key === k);
    if (S.saved[k]) { delete S.saved[k]; toast('Alerta desligado'); }
    else { S.saved[k] = { titulo: p.titulo, alvo: null }; toast(S.canal ? 'Alerta ligado. Aviso quando o preço sair do comum.' : 'Alerta ligado. Informe seu canal no Perfil para receber no celular.'); }
    persist(); openDetail(k);
  }
  else if (d.curti) {
    const k = d.curti, p = DATA.produtos.find(x => x.key === k);
    if (S.curtidas[k]) { delete S.curtidas[k]; toast('Curtida removida'); }
    else { const e = evaluate(p); S.curtidas = { ...S.curtidas, [k]: { marca: p.marca, kind: p.kind, titulo: p.titulo, preco: e.ok ? e.price : null, em: Date.now() } }; toast(p.kind === 'outro' ? 'Curtido. Vou trazer mais peças assim.' : `Curtido. Vou trazer mais ${KIND_LABEL[p.kind].toLowerCase()} assim.`); }
    persist();
    // na tela da peça, redesenha a peça; na lista, só troca o coração (sem reordenar o feed debaixo do dedo)
    if (!document.getElementById('sheet').hidden) openDetail(k);
    else document.querySelectorAll(`.heart[data-curti="${CSS.escape(k)}"]`).forEach(h => { const on = !!S.curtidas[k]; h.classList.toggle('on', on); h.textContent = on ? '♥' : '♡'; h.setAttribute('aria-pressed', on); h.setAttribute('aria-label', on ? 'Remover curtida' : 'Curtir'); });
  }
  else if (d.unsave) { delete S.saved[d.unsave]; render(); }
  else if (d.follow) {
    const n = d.follow;
    S.follow = S.follow.includes(n) ? S.follow.filter(x => x !== n) : [...S.follow, n];
    toast(S.follow.includes(n) ? `Seguindo ${n}` : `Você deixou de seguir ${n}`); render();
  }
  else if (d.ocultar) {
    const p = DATA.produtos.find(x => x.key === d.ocultar);
    S.ocultas = { ...S.ocultas, [d.ocultar]: { marca: p.marca, kind: p.kind } };
    closeSheet(); render(); toast(`Escondida. Vou mostrar menos ${KIND_LABEL[p.kind].toLowerCase()} da ${p.marca}.`);
  }
  else if (d.delmodelo) { S.modelos = S.modelos.filter(m => m.id !== d.delmodelo); render(); }
  else if ('sync' in d) { sincronizar(prefsAtuais(), true); }
  else if ('restaurar' in d) { S.ocultas = {}; render(); toast('Todas as peças escondidas voltaram'); }
  else if (d.busca) { S.tab = 'ofertas'; S.q = d.busca.replace(/^New Balance /, ''); S.qBrand = 'Todas'; S.qSale = false; S.qKind = 'Tudo'; S.limit = 40; render(); window.scrollTo(0, 0); }
  else if (d.fffaixa) { FFS.faixa = d.fffaixa; FFS.marca = 'Todas'; render(); }
  else if (d.fftipo) { FFS.tipo = d.fftipo; render(); }
  else if ('ffsale' in d) { FFS.sale = !FFS.sale; render(); }
  else if (d.tema) { S.tema = d.tema; aplicarTema(); render(); }
  else if (d.ffi !== undefined) { abrirImportado(+d.ffi); }
  else if ('filtros' in d) { S.filtrosAbertos = !S.filtrosAbertos; render(); }
  else if ('limpar' in d) { Object.assign(S, { q: '', qKind: 'Tudo', qBrand: 'Todas', qLoja: 'Todas', qMax: 3000, qSale: false, limit: 40 }); render(); }
  else if (d.loja) { S.qLoja = d.loja; S.limit = 40; render(); }
  else if (d.salebrand) { S.tab = 'ofertas'; S.qBrand = d.salebrand; S.qSale = true; S.q = ''; S.qKind = 'Tudo'; S.limit = 40; render(); window.scrollTo(0, 0); }
  else if (d.sw) { S[d.sw] = !S[d.sw]; render(); }
  else if (d.size) {
    const [g, o] = d.size.split(':'); const atual = S.sizes[g];
    if (atual.includes(o)) { if (atual.length > 1) S.sizes = { ...S.sizes, [g]: atual.filter(x => x !== o) }; else toast('Deixe pelo menos um tamanho marcado'); }
    else S.sizes = { ...S.sizes, [g]: [...atual, o].sort((a, b) => SIZE_OPTS[g].indexOf(a) - SIZE_OPTS[g].indexOf(b)) };
    render();
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { S.q = t.value; S.limit = 40; render(true); return; }
  const lbl = t.type === 'range' && t.closest('.field').querySelector('.lbl');
  if (t.id === 'qMax') lbl.textContent = +t.value >= 3000 ? 'qualquer' : brl(+t.value);
  else if (t.id === 'ffMax') lbl.textContent = brl(+t.value);
  else if (t.id === 'notaMin') lbl.textContent = t.value;
  else if (t.id === 'minSave') lbl.textContent = t.value + '%';
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.ordem !== undefined) S.sort = t.value;
  else if (t.id === 'qBrand') S.qBrand = t.value;
  else if (t.id === 'qLoja') S.qLoja = t.value;
  else if (t.id === 'ffMarca') FFS.marca = t.value;
  else if (t.id === 'ffOrdem') FFS.ordem = t.value;
  else if (t.id === 'ffMax') FFS.max = +t.value;
  else if (t.id === 'qMax') S.qMax = +t.value;
  else if (t.id === 'notaMin') S.notaMin = +t.value;
  else if (t.id === 'minSave') S.minSave = +t.value;
  else if (t.id === 'canal') { S.canal = t.value.trim().toLowerCase(); store.set('ultimoSync', ''); if (S.canal) toast('Canal salvo'); }
  else if (t.dataset.alvo) { const v = parseFloat(t.value); S.saved[t.dataset.alvo].alvo = v > 0 ? v : null; }
  else return;
  render();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !document.getElementById('sheet').hidden) { closeSheet(); render(); } });
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'formModelo') return;
  ev.preventDefault();
  const texto = document.getElementById('mTexto').value.trim(), max = parseFloat(document.getElementById('mMax').value);
  if (!texto || !(max > 0)) { toast('Escreva o modelo e o preço máximo'); return; }
  S.modelos = [...S.modelos, { id: Date.now().toString(36), texto, max }];
  render(); toast(S.canal ? `Alerta criado: ${texto} até ${brl(max)}` : 'Alerta criado. Informe seu canal no Perfil para receber no celular.');
});

aplicarTema();
prefereClaro?.addEventListener?.('change', () => { if (S.tema === 'auto') aplicarTema(); });
load().then(() => {
  render();
  // link de notificação: abre a peça direto
  const m = location.hash.match(/^#produto=(.+)$/);
  if (m) { openDetail(decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
}).catch(err => {
  document.getElementById('app').innerHTML = `<p class="loading">Não consegui carregar os dados (${esc(err.message)}).<br>Rode <code>./atualizar.sh</code> e abra pelo <code>./servidor.sh</code>.</p>`;
});
</script>
</body>
</html>
