name: Atualizar Garimpo

on:
  schedule:
    # Black Friday: em novembro roda 4x por dia (8h, 12h, 16h e 20h); no resto do ano, 8h e 18h
    - cron: '0 11,15,19,23 * 11 *'
    - cron: '0 11,21 * 1-10,12 *'
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
    inputs:
      canal_teste:
        description: "Canal do ntfy para teste (vazio = avisos de verdade)"
        required: false
        default: ""
      teste_push:
        description: "Só mandar uma notificação de teste do Achei (não atualiza preços)"
        type: boolean
        required: false
        default: false
      top_agora:
        description: "Mandar o Top da semana agora (qualquer dia)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: garimpo
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Baixar preços das lojas
        if: ${{ !inputs.teste_push }}
        run: bash app/atualizar.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Recuperar preferências do celular (salvos e alertas de modelo)
        uses: actions/cache/restore@v6
        with:
          path: .prefs
          key: prefs-${{ github.run_id }}
          restore-keys: prefs-

      - name: Instalar o envio de notificações do Achei
        run: npm install --no-save --no-package-lock web-push@3   # fica fora da pasta app (que vira o site)

      - name: Mandar avisos para o celular (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EXTRA: ${{ secrets.NTFY_EXTRA }}
          CANAL_TESTE: ${{ inputs.canal_teste }}
          FORCAR_TOP10: ${{ inputs.top_agora && '1' || '' }}
          TESTE_PUSH: ${{ inputs.teste_push && '1' || '' }}
          VAPID_PUBLIC: ${{ vars.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node app/alertas.js

      - name: Guardar preferências do celular para a próxima rodada
        if: ${{ always() && !inputs.canal_teste }}
        uses: actions/cache/save@v6
        with:
          path: .prefs
          key: prefs-${{ github.run_id }}

      - name: Salvar os dados novos
        if: ${{ !inputs.teste_push }}
        run: |
          git config user.name "garimpo-bot"
          git config user.email "garimpo-bot@users.noreply.github.com"
          git add app/data
          git diff --cached --quiet || git commit -m "Atualiza preços $(date '+%d/%m %H:%M')"
          git pull --rebase -X theirs --quiet origin main   # em conflito nos dados, fica a versão desta rodada
          git push

      - name: Preparar o site
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

      - name: Publicar no GitHub Pages
        if: ${{ !cancelled() }}
        id: site
        uses: actions/deploy-pages@v5
        continue-on-error: true   # o GitHub às vezes falha ao achar o pacote; tenta de novo abaixo

      - name: Esperar antes da 2ª tentativa
        if: ${{ steps.site.outcome == 'failure' }}
        run: sleep 45

      - name: Publicar no GitHub Pages (2ª tentativa)
        if: ${{ steps.site.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
