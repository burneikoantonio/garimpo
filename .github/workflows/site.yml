name: Publicar site

# quando eu mudo o app (sem ser os dados de preço), publica na hora sem rodar a atualização das lojas
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: garimpo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      # pega o main mais novo (não o do push): se o robô salvou preços enquanto este esperava na fila, eles entram
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: site
        uses: actions/deploy-pages@v5
        continue-on-error: true   # o GitHub às vezes falha ao achar o pacote; tenta de novo abaixo

      - name: Esperar antes da 2ª tentativa
        if: ${{ steps.site.outcome == 'failure' }}
        run: sleep 45

      - name: Publicar no GitHub Pages (2ª tentativa)
        if: ${{ steps.site.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
