name: Publicar site

# quando eu mudo o app (sem ser os dados de preço), publica na hora sem rodar a atualização das lojas
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: garimpo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      # pega o main mais novo (não o do push): se o robô salvou preços enquanto este esperava na fila, eles entram
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: site
        uses: actions/deploy-pages@v4
